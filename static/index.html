function renderCalcBreakdown(req, rec, chip, scoring){
  const vcalc = req.vram_calculation || {};
  const mcalc = req.model_calculation || {};
  const ccalc = rec.card_calculation || {};
  const components = vcalc.components || [];
  const fmtCalcGb = v => { const n=Number(v||0); return n>0&&n<0.1?n.toFixed(3):n.toFixed(1); };
  const isInference = req.scenario === 'inference';
  const idealLabel = isInference ? '目标并发部署' : '理想部署';
  const inputs = [];
  if(mcalc.total_params_b!=null) inputs.push(`总参数 ${mcalc.total_params_b}B`);
  if(mcalc.is_moe && mcalc.active_params_b!=null) inputs.push(`每token激活 ${mcalc.active_params_b}B`);
  inputs.push(`场景 ${req.scenario_label||req.scenario||'?'}`);
  if(req.scenario==='train'){
    inputs.push(`训练阶段 ${(req.stage||'').toUpperCase()}`);
    inputs.push(`方式 ${req.method==='full_param'?'全参':req.method}`);
    inputs.push(`Batch ${req.batch_size||1}`);
    inputs.push(`样本长度 ${req.seq_len||'?'} tokens`);
  }else if(req.scenario==='inference'){
    inputs.push(`精度 ${(req.quant||'fp16').toUpperCase()}`);
    inputs.push(`输入 ${req.input_len||'?'} tokens`);
    inputs.push(`输出 ${req.output_len||'?'} tokens`);
    inputs.push(`目标并发 ${req.concurrency||1}`);
  }else{
    inputs.push(`量化方式 ${req.method||'?'}`);
    inputs.push(`目标精度 ${(req.quantize_bits||'').toUpperCase()}`);
  }

  const fullTier = ccalc.full || {};
  const idealTier = ccalc.ideal || {};
  const fullCards = rec.full_cards!=null ? rec.full_cards : rec.recommended_cards;
  const summary = isInference
    ? `${Number(req.full_vram_gb??req.min_vram_gb??0).toFixed(1)}GB ÷ ${chip.vram_gb||'?'}GB/卡 → ${fullCards||'?'}卡（最小）`
    : `${req.min_vram_gb!=null?Number(req.min_vram_gb).toFixed(1):'?'}GB ÷ ${chip.vram_gb||'?'}GB/卡 → ${rec.vram_cards||'?'}卡（最小）`;
  const componentHtml = components.length ? components.map(comp=>`
    <div class="calc-component">
      <div class="cc-name">${esc(comp.label||comp.id||'组成项')}</div>
      <div class="cc-formula">${esc(comp.formula||'')}</div>
      <div class="cc-result">${fmtCalcGb(comp.result_gb)} GB</div>
    </div>`).join('') : `<div class="calc-component"><div class="cc-formula">${esc(req.full_vram_formula||req.vram_formula||'暂无逐项数据')}</div></div>`;

  const tierRows = isInference ? [
    {name:fullTier.label||'最小部署', value:`${fullCards} 卡`, formula:fullTier.formula||`ceil(${req.full_vram_gb}÷${chip.vram_gb}) → ${fullCards}`},
    {name:idealTier.label||'目标并发部署', value:`${rec.recommended_cards} 卡`, formula:idealTier.formula||'权重 + 单请求KV×目标并发，再除以单卡显存并取2的幂'},
  ] : [
    {name:'最小部署', value:`${rec.vram_cards} 卡`, formula:(ccalc.minimum||{}).formula||`ceil(${req.min_vram_gb}÷${chip.vram_gb}) → ${rec.vram_cards}`},
    {name:idealTier.label||idealLabel, value:`${rec.recommended_cards} 卡`, formula:idealTier.formula||`${idealLabel}卡数取最小部署与性能约束的较大值`},
  ];
  const tierHtml = tierRows.map(t=>`<div class="calc-tier"><div class="ct-name">${esc(t.name)}</div><div class="ct-value">${esc(t.value)}</div><div class="ct-formula">${esc(t.formula)}</div></div>`).join('');

  return `<details class="calc-breakdown">
    <summary><span class="calc-arrow">▶</span> 🧮 显存与卡数计算明细 <span class="calc-summary-text">${esc(summary)}</span></summary>
    <div class="calc-body">
      <div class="calc-inputs">${inputs.map(x=>`<span class="calc-chip">${esc(x)}</span>`).join('')}</div>
      ${mcalc.is_moe ? `<div class="calc-moe-note"><span>⚠️</span><span><b>MoE 口径：</b>${esc(mcalc.note||'激活参数影响计算量；常驻权重显存按总参数量计算。')}${mcalc.num_experts?` 当前配置 ${esc(mcalc.num_experts)} 个专家${mcalc.experts_per_token?`，每 token 路由 ${esc(mcalc.experts_per_token)} 个`:''}。`:''}</span></div>` : ''}
      <div class="calc-section-title">① 显存由什么组成</div>
      ${componentHtml}
      <div class="calc-total-line">${isInference
        ? `最小显存 <b>${Number(req.full_vram_gb??req.min_vram_gb??0).toFixed(1)} GB</b> = 权重 + 单请求峰值KV；目标并发显存 <b>${Number(req.target_vram_gb??req.full_vram_gb??0).toFixed(1)} GB</b> = 权重 + 单请求KV × ${req.concurrency||1}`
        : req.scenario==='train'
          ? `最小部署显存 <b>${Number(req.min_vram_gb||0).toFixed(1)} GB</b> = 模型状态 + 训练激活值；理想部署不新增显存档，而是按训练性能目标与最小卡数取较大值`
          : `最小部署显存 <b>${Number(req.min_vram_gb||0).toFixed(1)} GB</b>；未设置额外性能目标时，理想部署等同最小部署`}</div>
      <div class="calc-section-title">② 显存如何换算成卡数</div>
      <div class="calc-tiers two">${tierHtml}</div>
      <div class="calc-total-line">取整规则：<b>${esc(ccalc.rounding_rule||'ceil 后向上取2的幂')}</b>${rec.total_cost_wan!=null?`；按${idealLabel}估算总价 <b>${esc(rec.total_cost_wan)} 万元</b>`:''}</div>
    </div>
  </details>`;
}

async function loadMethodology() {
  const content = $('methodology-content');
  const loading = $('methodology-loading');
  show(loading); content.innerHTML = '';
  try {
    const data = await fetchJSON(`${API}/methodology`);
    if (data._error) { content.innerHTML = `<div class="error">${esc(data._error)}</div>`; hide(loading); return; }
    const dims = data.scoring_dimensions || [];
    const catMap = {
      compute_power: {cn:'算力性能', icon:'⚡', desc:'单卡算力与带宽，决定训练/推理的根本上限'},
      cost_effectiveness: {cn:'性价比', icon:'💰', desc:'能效 + 集群经济性，影响部署总成本'},
      ecosystem_maturity: {cn:'生态成熟度', icon:'🌐', desc:'框架 + 工具链 + 数据可信度'},
      benchmark_evidence: {cn:'实测验证度', icon:'🧪', desc:'实测 benchmark 数据(MFU/吞吐)独立评分'}
    };
    // Group dimensions by category
    const groups = {};
    dims.forEach(d => {

function tabFromLocation() {
  const path = location.pathname.length > 1
    ? location.pathname.replace(/\/+$/, '')
    : '/';
  if (PATH_TABS[path]) return PATH_TABS[path];
  // Keep previously shared hash links working after adopting clean URLs.
  if (location.hash === '#methodology') return 'methodology';
  if (location.hash === '#vram-logic') return 'vram-logic';
  return 'agent';
}

function switchToTab(tabId, {updateUrl=false, replace=false}={}) {
  if (!TABS.some(t=>t.id===tabId)) tabId = 'agent';
  STATE.currentTab = tabId;
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('tab-'+tabId);
  if (panel) panel.classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector('nav button[data-tab="'+tabId+'"]');
  if (btn) btn.classList.add('active');
  const def = TABS.find(t=>t.id===tabId);
  if (def && def.action) def.action();
  if (updateUrl) {
    const targetPath = TAB_PATHS[tabId] || '/';
    const target = EMBED_MODE ? `${targetPath}?embed=1` : targetPath;
    if (`${location.pathname}${location.search}` !== target || location.hash) {
      history[replace ? 'replaceState' : 'pushState']({tab:tabId}, '', target);
    }
  }
}

(function initRouting(){
  const initialTab = tabFromLocation();
  switchToTab(initialTab, {updateUrl:true, replace:true});
  window.addEventListener('popstate', ()=>switchToTab(tabFromLocation()));
  window.addEventListener('hashchange', ()=>switchToTab(tabFromLocation(), {updateUrl:true, replace:true}));
})();

async function searchCompat(){
  if(!_pager_click){COMPAT_PAGE_STATE.page=1;}
  _pager_click = false;
  const loading=$('compat-loading'), results=$('compat-results'), sum=$('compat-summary');
  show(loading);results.innerHTML='';sum.textContent='';

  const params = new URLSearchParams();
  const chip=($('compat-chip')||{}).value;if(chip&&chip.trim())params.set('chip',chip.trim());
  const model=($('compat-model')||{}).value;if(model&&model.trim())params.set('model',model.trim());
  const st=($('compat-status')||{}).value;if(st)params.set('status',st);
  if($('compat-has-bench').classList.contains('on')) params.set('has_benchmark','true');
  params.set('limit', String(COMPAT_PAGE_STATE.limit));
  params.set('offset', String((COMPAT_PAGE_STATE.page - 1) * COMPAT_PAGE_STATE.limit));

  const data = await fetchJSON(`${API}/compat?${params}`);
  hide(loading);
  if(data._error){results.innerHTML=`<div class="error">${esc(data._error)}</div>`;return}

  sum.innerHTML = `<span style="font-size:0.8rem;color:var(--text3)">找到 <b>${data.count}</b> 条兼容记录`+
    (data.count > COMPAT_PAGE_STATE.limit ? ` · 第 <b>${COMPAT_PAGE_STATE.page}</b> / <b>${Math.ceil(data.count/COMPAT_PAGE_STATE.limit)}</b> 页` : '')+
    `</span>`;
  if(!data.compatibilities||!data.compatibilities.length){results.innerHTML='<div class="empty">未找到匹配的兼容记录</div>';return}

  results.innerHTML = data.compatibilities.map((c,i)=>renderCompatCard(c,i)).join('');
  results.innerHTML += buildPager(COMPAT_PAGE_STATE.page, COMPAT_PAGE_STATE.limit, data.count, 'COMPAT_PAGE_STATE.page');

  // Add delegated click handlers for expand/collapse
  setTimeout(function(){
    document.querySelectorAll('[id^="compat-title-"]').forEach(function(el){
      el.onclick = function(){
        var detailId = el.id.replace('compat-title-','compat-detail-');
        var detail = document.getElementById(detailId);
        if(detail) detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
      };
    });
  }, 50);
}

function renderCompatCard(c, idx){
  var iden = c.identity || c;
  var det = c.compat_details || c;
  var ev = c.benchmark_evidence || {};
  var hasBench = ev.count > 0;

  function evBadge(el){
    if(!el) return '';
    var colors = {
      official_benchmark: 'rgba(52,211,153,0.15);color:var(--green)',
      peer_reviewed: 'rgba(129,140,248,0.15);color:var(--accent)',
      open_audited_benchmark: 'rgba(96,165,250,0.15);color:var(--blue)',
      community_parsed: 'rgba(251,146,60,0.15);color:var(--orange)',
      internal_test: 'rgba(192,132,252,0.15);color:var(--purple)',
    };
    var style = colors[el] || 'rgba(107,114,128,0.12);color:var(--text2)';
    return '<span style="font-size:0.62rem;padding:1px 5px;border-radius:3px;margin-left:4px;'+style+'">'+esc(el)+'</span>';
  }

  var srcLinks = (ev.source_urls||[]).map(function(u){
    var short = u.length > 50 ? u.slice(0,50)+'…' : u;
    return '<a href="'+esc(u)+'" target="_blank" rel="noopener" style="color:var(--accent);font-size:0.65rem" title="'+esc(u)+'">&#128279; '+esc(short)+'</a>';
  });

  var bmRows = (ev.benchmarks||[]).slice(0,5);
  var bmDetails = bmRows.map(function(b){
    var perf = (b.throughput_tok_s ? esc(b.throughput_tok_s)+' tok/s' : b.mfu_pct ? esc(b.mfu_pct)+'% MFU' : '-');
    var srcCol = esc(b.source_type||b.test_date||'-');
    var linkCol = (b.source_url ? '<a href="'+esc(b.source_url)+'" target="_blank" style="color:var(--accent)">link</a>' : '-');
    return '<tr>'+
      '<td>'+esc(b.evidence_level||b.confidence||'-')+'</td>'+
      '<td>'+perf+'</td>'+
      '<td>'+esc(b.precision||'-')+'</td>'+
      '<td>'+esc(b.framework||'-')+'</td>'+
      '<td>'+srcCol+'</td>'+
      '<td>'+linkCol+'</td>'+
    '</tr>';
  }).join('');

  var h = '';
  h += '<div class="compat-card" style="background:var(--bg2);border:var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px">';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">';
  h += '<div style="flex:1;min-width:200px">';

  // Title row — clickable expand/collapse if has benchmarks
  h += '<div style="font-weight:600;font-size:0.85rem;'+(hasBench?'cursor:pointer':'')+'"'+' id="compat-title-'+idx+'"'+'>';
  h += '<span>'+esc(iden.chip_model)+' ↔ '+esc(iden.model_id)+'</span>';
  if(hasBench) h += ' <span style="font-size:0.65rem;color:var(--green);margin-left:4px">▼</span>';
  h += '</div>';

  // Framework + precision
  h += '<div style="font-size:0.73rem;color:var(--text2);margin-top:2px;display:flex;align-items:center;flex-wrap:wrap;gap:6px">';
  h += esc(det.framework||'')+' · '+esc(det.precision||'');
  if(det.verified_at) h += '<span style="color:var(--text3)"> · '+esc(det.verified_at)+'</span>';
  h += '</div>';

  // Benchmark evidence row
  h += '<div style="font-size:0.7rem;color:var(--text3);margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px">';
  if(hasBench){
    h += '<span style="color:var(--green);font-weight:600">&#128202; '+ev.count+' 条实测</span>';
    h += '<span> · 最高: '+(ev.max_throughput_tok_s ? esc(ev.max_throughput_tok_s)+' tok/s' : ev.max_mfu_pct ? esc(ev.max_mfu_pct)+'% MFU' : '—')+'</span>';
    if(ev.top_evidence) h += evBadge(ev.top_evidence);
  } else {
    h += '<span style="color:var(--text3)">&#128202; 无实测</span>';
  }
  (ev.sources||[]).slice(0,3).forEach(function(s){
    h += '<span style="font-size:0.62rem;background:var(--bg3);padding:1px 5px;border-radius:3px;color:var(--text2)">'+esc(s)+'</span>';
  });
  h += '</div>';

  // Source links
  if(srcLinks.length) h += '<div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:4px">'+srcLinks.slice(0,2).join('')+'</div>';
  // Notes
  if(det.notes) h += '<div style="font-size:0.68rem;color:var(--text3);margin-top:2px;font-style:italic">💬 '+esc(det.notes)+'</div>';
  h += '</div>'; // end left side

  // Status badge
  var statusBg = det.compat_status==='verified'?'rgba(52,211,153,0.15)':det.compat_status==='vendor_claimed'?'rgba(251,146,60,0.15)':'rgba(96,165,250,0.15)';
  var statusClr = det.compat_status==='verified'?'var(--green)':det.compat_status==='vendor_claimed'?'var(--orange)':'var(--blue)';
  h += '<span style="font-size:0.75rem;padding:4px 10px;border-radius:4px;font-weight:600;flex-shrink:0;background:'+statusBg+';color:'+statusClr+'">'+esc(det.compat_status)+'</span>';
  h += '</div>'; // end flex row

  // Expandable benchmark details
  if(bmRows.length){
    h += '<div id="compat-detail-'+idx+'" style="display:none;margin-top:8px;border-top:var(--border);padding-top:8px">';
    h += '<div style="font-size:0.7rem;font-weight:600;color:var(--text2);margin-bottom:4px">&#128202; 关联实测数据 ('+ev.count+'条中展示前5条)</div>';

    h += '<thead><tr><th>证据等级</th><th>性能</th><th>精度</th><th>框架</th><th>来源</th><th>链接</th></tr></thead>';
    h += '<tbody>'+bmDetails+'</tbody>';
    h += '</table></div></div>';
  }
  h += '</div>'; // end card
  return h;
}
