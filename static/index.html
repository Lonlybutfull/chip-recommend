<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISHPerf — 算力选型知识图谱 v0.5</title>
<script>
/* 芯片搜索、模型搜索、算力推荐被 iframe 嵌入时自动隐藏平台导航；?embed=1 可显式预览。 */
(function(){
  var path=location.pathname.length>1?location.pathname.replace(/\/+$/,''):'/';
  var supported=['/chips','/models','/recommend'].indexOf(path)>=0;
  var requested=new URLSearchParams(location.search).get('embed');
  var framed=window.self!==window.top;
  if(supported&&(framed||requested==='1'||requested==='true')){
    document.documentElement.classList.add('embed-mode');
  }
})();
</script>
<style>
/* ── Reset & Base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f5;--bg2:#ffffff;--bg3:#f7f8fa;--bg4:#e8eaed;
  --text:#1a1d2b;--text2:#6b7280;--text3:#9ca3af;
  --accent:#2d8cf0;--accent2:#1a6fd4;--green:#10b981;--red:#ef4444;
  --orange:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6;
  --radius:10px;--radius-sm:6px;--border:1px solid var(--bg4);
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-hover:0 4px 12px rgba(0,0,0,0.08);
  --transition:0.2s ease;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);line-height:1.6;
  min-height:100vh;
}
a{color:var(--accent);text-decoration:none}

/* ── Header ── */
header{
  background:var(--bg2);border-bottom:var(--border);
  padding:0 24px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 2px rgba(0,0,0,0.04);
}
.header-inner{
  max-width:1440px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;height:60px;gap:12px;
}
.logo{font-size:1.2rem;font-weight:700;color:var(--text)}
.logo span{color:var(--accent)}
.version{font-size:0.7rem;color:var(--text3);font-weight:400}

/* ── Tabs ── */
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{
  background:none;border:none;color:var(--text2);font-size:0.8rem;
  padding:8px 14px;border-radius:6px;cursor:pointer;
  font-weight:500;transition:var(--transition);white-space:nowrap;
}
nav button:hover{color:var(--accent);background:var(--bg3)}
nav button.active{color:var(--accent);background:rgba(45,140,240,0.08)}
.hermes-nav-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:7px 14px;border-radius:16px;cursor:pointer;
  font-size:0.78rem;font-weight:600;color:var(--purple);
  background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.25);
  transition:var(--transition);white-space:nowrap;text-decoration:none;
  margin-right:6px;
}
.hermes-nav-btn:hover{background:rgba(139,92,246,0.16);border-color:var(--purple);color:var(--purple)}
.api-link{
  color:var(--text2);font-size:0.8rem;font-weight:500;
  padding:7px 14px;border-radius:6px;text-decoration:none;
  border:var(--border);transition:var(--transition);white-space:nowrap;
}
.api-link:hover{color:var(--accent);border-color:var(--accent);background:rgba(45,140,240,0.04)}
.api-links{display:flex;gap:8px}

/* ── Main ── */
main{max-width:1440px;margin:0 auto;padding:20px 24px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── Filters bar ── */
.filters{
  display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;
  align-items:center;padding:14px 16px;background:var(--bg2);
  border-radius:var(--radius);border:var(--border);box-shadow:var(--shadow);
}
.filters input,.filters select{
  background:var(--bg3);color:var(--text);border:var(--border);
  border-radius:var(--radius-sm);padding:8px 12px;font-size:0.84rem;
  outline:none;transition:var(--transition);
}
.filters input:focus,.filters select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,140,240,0.12)}
.filters .autocomplete-wrapper{flex:1;min-width:160px}
.filters select{min-width:100px}
.filters .btn{
  background:var(--accent);color:#fff;border:none;padding:9px 20px;
  border-radius:var(--radius-sm);font-weight:600;cursor:pointer;
  font-size:0.84rem;transition:var(--transition);
}
.filters .btn:hover{background:var(--accent2);box-shadow:var(--shadow-hover);transform:translateY(-1px)}
.vram-slider{display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--text2)}
.vram-slider input{width:80px;min-width:60px;text-align:center}

/* ── Autocomplete dropdown ── */
.autocomplete-wrapper{position:relative;flex:1;min-width:160px}
.autocomplete-wrapper .ac-input{width:100%}
.ac-dropdown{display:none;position:absolute;top:100%;left:0;right:0;z-index:500;
  max-height:280px;overflow-y:auto;background:var(--bg2);border:1px solid var(--accent);
  border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.ac-dropdown.open{display:block}
.ac-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;
  font-size:0.78rem;border-bottom:var(--border);transition:var(--transition)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.active{background:var(--bg3)}
.ac-item .ac-name{font-weight:600;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-item .ac-meta{color:var(--text3);font-size:0.68rem;white-space:nowrap;flex-shrink:0}
.ac-item .ac-tag{font-size:0.62rem;padding:1px 5px;border-radius:3px;flex-shrink:0}
.ac-empty{padding:10px 14px;font-size:0.75rem;color:var(--text3);text-align:center}
/* Selected tags */
.ac-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ac-tag{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:#fff;
  padding:3px 10px;border-radius:14px;font-size:0.72rem;cursor:pointer}
.ac-tag:hover{background:var(--red)}

/* ── Cards ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{
  background:var(--bg2);border:var(--border);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;transition:var(--transition);box-shadow:var(--shadow);
}
.card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-hover)}

.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card-vendor{
  font-size:0.72rem;padding:2px 8px;border-radius:4px;
  font-weight:600;letter-spacing:0.04em;
}
.vendor-foreign{background:rgba(59,130,246,0.1);color:var(--blue)}
.vendor-domestic{background:rgba(245,158,11,0.1);color:var(--orange)}
.card-model{font-size:1rem;font-weight:600;margin-bottom:4px}
.card-series{font-size:0.78rem;color:var(--text3);margin-bottom:8px}

.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}
.card-stat{display:flex;justify-content:space-between;font-size:0.78rem}
.card-stat .label{color:var(--text3)}
.card-stat .value{font-weight:600;font-variant-numeric:tabular-nums}

.card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card-meta{display:flex;gap:12px;font-size:0.7rem;color:var(--text3);margin-top:6px;padding-top:6px;border-top:var(--border)}
.card-meta span{display:flex;align-items:center;gap:3px}
.tag{
  font-size:0.68rem;padding:2px 8px;border-radius:4px;
  background:var(--bg3);color:var(--text2);
}
.tag.precision{color:var(--purple);background:rgba(139,92,246,0.08)}
.tag.cloud{color:var(--blue);background:rgba(59,130,246,0.08)}
.tag.compat{color:var(--blue);background:rgba(59,130,246,0.08)}
.tag.undisclosed{color:var(--red);background:rgba(239,68,68,0.08);font-weight:600}

/* ── Detail panel ── */
.detail-overlay{
  display:none;position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);
  overflow-y:auto;padding:24px;
}
.detail-overlay.open{display:flex;justify-content:center;align-items:center}
.detail-panel{
  background:var(--bg2);border:var(--border);border-radius:var(--radius);
  width:100%;max-width:960px;max-height:82vh;
  display:flex;flex-direction:column;
  box-shadow:0 16px 48px rgba(0,0,0,0.12);overflow:hidden;
}
.detail-header{
  padding:18px 22px;border-bottom:var(--border);
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;background:var(--bg2);border-radius:var(--radius) var(--radius) 0 0;z-index:10;
}
.detail-header h2{font-size:1.1rem}
.detail-close{
  background:var(--bg4);border:none;color:var(--text);width:30px;height:30px;
  border-radius:50%;cursor:pointer;font-size:1rem;display:flex;
  align-items:center;justify-content:center;transition:var(--transition);
}
.detail-close:hover{background:var(--red);color:#fff}
/* ── Detail tabs (v3.0) ── */
.detail-tabs{
  display:flex;gap:4px;padding:0 22px;border-bottom:var(--border);
  background:var(--bg3);overflow-x:auto;
}
.detail-tab{
  background:none;border:none;color:var(--text2);font-size:0.78rem;
  padding:10px 16px;cursor:pointer;font-weight:500;
  border-bottom:2px solid transparent;transition:var(--transition);
  white-space:nowrap;
}
.detail-tab:hover{color:var(--text);background:var(--bg4)}
.detail-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.detail-tab-panel{display:none;padding:14px 22px 22px;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;word-break:break-word}
.detail-tab-panel.active{display:block;overflow-y:auto;max-height:100%}
.detail-body{padding:0;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}

.group{
  margin-bottom:14px;border:var(--border);border-radius:var(--radius-sm);
  overflow:visible;
}
.group-header{
  padding:9px 14px;background:var(--bg3);
  font-size:0.78rem;font-weight:700;
  letter-spacing:0.05em;color:var(--accent);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  position:relative;z-index:1;text-transform:none;
}
.group-header{text-transform:none;}
.group.collapsed .group-body{display:none}
.group-body{overflow:visible!important;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.group-field{overflow:visible;display:flex;justify-content:space-between;font-size:0.78rem;gap:6px;padding:4px 6px;border-bottom:var(--border);border-radius:2px}
.group-field:nth-child(even){background:var(--bg4)}
.group-field .key{color:var(--text3);white-space:nowrap;min-width:120px}
.group-field .val{font-weight:500;text-align:right;word-break:break-all;position:relative;cursor:help}
.group-field .val:hover{color:var(--accent)}

/* Provenance tooltip — positioned via JS, CSS fallback */
.prov-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);right:0;z-index:99999;
  background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 10px;min-width:240px;max-width:380px;box-shadow:0 12px 32px rgba(0,0,0,0.2);
  font-size:0.68rem;text-align:left;pointer-events:none}
.val-has-provenance:hover>.prov-tooltip{display:block}

/* Provenance row */
.prov-row{
  font-size:0.72rem;padding:4px 8px;background:var(--bg3);border-radius:4px;
  margin:2px 0;color:var(--text2);
}
.prov-row .prov-src{color:var(--accent);word-break:break-all}

/* ── Table view ── */
.data-table{width:100%;border-collapse:collapse;font-size:0.78rem}
.data-table th{
  text-align:left;padding:8px 10px;background:var(--bg3);
  color:var(--text2);font-weight:600;border-bottom:var(--border);
  position:sticky;top:0;
}
.data-table td{padding:6px 10px;border-bottom:var(--border)}
.data-table tr:hover{background:var(--bg3)}
.table-wrap{max-height:500px;overflow:auto;border:var(--border);border-radius:var(--radius-sm)}

/* ── Recommend form ── */
.recommend-form{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:10px;padding:18px;background:var(--bg2);border-radius:var(--radius);
  border:var(--border);margin-bottom:18px;
}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:0.73rem;color:var(--text2);font-weight:600}
.form-group input,.form-group select{
  background:var(--bg3);color:var(--text);border:var(--border);
  border-radius:var(--radius-sm);padding:8px 10px;font-size:0.85rem;outline:none;
}
.form-group input:focus,.form-group select:focus{border-color:var(--accent)}
.form-actions{grid-column:1/-1;display:flex;gap:8px}
.form-actions .btn{padding:9px 24px;font-size:0.88rem}
.toggle-row{display:flex;align-items:center;gap:6px}
.toggle-row label{font-size:0.8rem;color:var(--text2)}
.toggle{
  width:40px;height:22px;background:var(--bg4);border-radius:11px;
  position:relative;cursor:pointer;transition:var(--transition);
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;width:16px;height:16px;background:#fff;
  border-radius:50%;top:3px;left:3px;transition:var(--transition);
}
.toggle.on::after{left:21px}

/* ── Advanced filter (collapsible) ── */
.rec-advanced{grid-column:1/-1;border:var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg3)}
.rec-advanced summary{
  cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;
  padding:10px 14px;font-weight:600;font-size:0.85rem;color:var(--text);user-select:none;
}
.rec-advanced summary::-webkit-details-marker{display:none}
.rec-advanced summary::marker{display:none}
.rec-advanced .rec-adv-arrow{margin-left:auto;color:var(--text2);font-size:0.7rem;transition:transform 0.2s}
.rec-advanced[open] .rec-adv-arrow{transform:rotate(90deg)}
.rec-advanced-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:14px;border-top:var(--border)}

/* ── Recommend result card ── */
.rec-card{
  background:var(--bg2);border:var(--border);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:10px;transition:var(--transition);
}
.rec-card:hover{border-color:var(--accent)}
.rec-card.best{border-color:var(--accent);box-shadow:0 4px 16px rgba(45,140,240,0.15)}
.rec-rank{font-size:.86rem;color:var(--accent);font-weight:700;margin-bottom:10px}
.rec-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.rec-header h3{font-size:0.95rem}
.rec-score{font-size:1.3rem;font-weight:700;color:var(--accent)}
.rec-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;margin-bottom:8px}
.rec-stat .label{font-size:0.68rem;color:var(--text3)}
.rec-stat .value{font-size:0.85rem;font-weight:600}
.rec-rationale{font-size:.82rem;color:var(--text2)}
/* ── Recommend card overview (3 columns) ── */
.rec-overview-grid{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.1fr) minmax(250px,.85fr);
  gap:12px;margin-bottom:12px;
}
.rec-overview-panel{
  min-width:0;background:var(--bg3);border:1px solid var(--bg4);
  border-radius:var(--radius-sm);padding:14px 16px;
}
.rec-overview-title{
  display:flex;align-items:center;gap:7px;margin-bottom:11px;
  color:var(--text);font-size:1.08rem;font-weight:750;line-height:1.3;
}
.rec-basic-primary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rec-basic-field{
  min-width:0;padding:8px 10px;background:var(--bg2);border:1px solid var(--bg4);
  border-radius:6px;
}
.rec-basic-field.wide{grid-column:1/-1}
.rec-basic-field .label{font-size:.73rem;color:var(--text3);margin-bottom:2px}
.rec-basic-field .value{font-size:.92rem;color:var(--text);font-weight:700;line-height:1.45;word-break:break-word}
.rec-basic-field .value.precision{font-size:.78rem;font-weight:600}
.rec-basic-secondary{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.rec-basic-secondary span{
  padding:3px 7px;border-radius:4px;background:var(--bg4);color:var(--text2);
  font-size:.71rem;line-height:1.4;
}
.rec-basic-actions{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.rec-basic-actions .rec-profile-btn{margin-left:0}
.rec-reason-list{list-style:none;display:grid;gap:9px}
.rec-reason-list li{font-size:.83rem;color:var(--text2);line-height:1.55;padding-left:14px;position:relative}
.rec-reason-list li::before{content:'•';position:absolute;left:0;color:var(--accent);font-weight:800}
.rec-reason-list b{color:var(--text);font-weight:700}
.rec-quantity-list{display:grid;gap:10px}
.rec-quantity-tier{
  display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;
  padding:11px 12px;background:var(--bg2);border:1px solid var(--bg4);border-radius:7px;
}
.rec-quantity-tier.primary{border-color:rgba(45,140,240,.35);background:rgba(45,140,240,.045)}
.rec-quantity-tier .qt-name{font-size:.83rem;color:var(--text);font-weight:700}
.rec-quantity-tier .qt-cards{grid-row:1/3;grid-column:2;font-size:1.35rem;color:var(--accent);font-weight:800;white-space:nowrap}
.rec-quantity-tier .qt-cards small{font-size:.72rem;margin-left:2px;color:var(--text2)}
.rec-quantity-tier .qt-desc{font-size:.7rem;color:var(--text3);line-height:1.45}
.rec-quantity-note{margin-top:9px;color:var(--text3);font-size:.69rem;line-height:1.5}
.rec-deployment-content{margin-top:12px;padding-top:11px;border-top:1px solid var(--bg4)}
.rec-deployment-content .deployment-title{font-size:.86rem;font-weight:750;color:var(--text);margin-bottom:7px}
.rec-deployment-content .rec-rationale{font-size:.77rem;line-height:1.5;margin-bottom:8px}
.rec-deployment-content .rec-deploy-link,.rec-deployment-content .rec-deploy-none{margin-left:0;font-size:.74rem}
@media(max-width:1050px){
  .rec-overview-grid{grid-template-columns:1fr 1fr}
  .rec-quantity-panel{grid-column:1/-1}
  .rec-quantity-list{grid-template-columns:1fr 1fr}
}
@media(max-width:720px){
  .rec-overview-grid{grid-template-columns:1fr}
  .rec-quantity-panel{grid-column:auto}
  .rec-quantity-list{grid-template-columns:1fr}
  .rec-basic-primary{grid-template-columns:1fr}
  .rec-basic-field.wide{grid-column:auto}
}
/* ── Legacy compact row helpers ── */
.rec-calc-row{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px;
  background:var(--bg3);border-radius:var(--radius-sm);padding:10px 14px;
}
@media(max-width:700px){.rec-calc-row{grid-template-columns:1fr}}
.rec-calc-item{font-size:0.73rem;padding:2px 0}
.rec-calc-item .rcl{color:var(--text3);font-size:0.68rem}
.rec-calc-item .rcv{color:var(--text);font-weight:600}
.rec-calc-item .rcd{color:var(--text3);font-size:0.63rem;word-break:break-all}
.rec-chip-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--bg3);border-radius:var(--radius-sm);padding:8px 14px;margin-bottom:10px;
  font-size:0.75rem;
}
.rec-chip-row .chip-name{font-weight:700;font-size:0.88rem;color:var(--text)}
.rec-chip-row .chip-meta{color:var(--text2);font-size:0.7rem}
.rec-chip-row .chip-spec{color:var(--text);font-weight:500;font-size:0.72rem;white-space:nowrap}
.rec-chip-row .chip-spec-sep{color:var(--bg4)}
.rec-profile-btn{
  display:inline-block;margin-left:auto;font-size:.72rem;color:var(--accent);
  cursor:pointer;padding:4px 10px;border:1px solid var(--accent);border-radius:4px;
  transition:var(--transition);background:transparent;white-space:nowrap;flex-shrink:0;
}
.rec-profile-btn:hover{background:var(--accent);color:#fff}
.rec-deploy-link{
  display:inline-block;font-size:.74rem;color:var(--green);cursor:pointer;
  padding:4px 10px;border:1px solid var(--green);border-radius:4px;
  transition:var(--transition);background:transparent;white-space:nowrap;
  text-decoration:none;flex-shrink:0;margin-left:auto;
}
.rec-deploy-link:hover{background:var(--green);color:#fff}
.rec-deploy-none{
  font-size:.72rem;color:var(--text3);white-space:nowrap;margin-left:auto;
}
/* ── Scoring detail panel (collapsible) ── */
.rec-scoring-breakdown{
  margin:0 0 8px;border:1px solid rgba(45,140,240,.22);
  background:rgba(45,140,240,.035);border-radius:8px;overflow:hidden;
}
.rec-scoring-toggle{
  display:flex;align-items:center;gap:8px;width:100%;font-size:.91rem;font-weight:700;
  color:var(--accent);cursor:pointer;user-select:none;padding:10px 12px;
}
.rec-scoring-toggle .arrow{transition:transform 0.2s;font-size:.62rem}
.rec-scoring-toggle.open .arrow{transform:rotate(90deg)}
.rec-scoring-panel{
  display:none;margin:0;border-top:1px solid rgba(45,140,240,.14);padding:10px 12px 4px;
}
.rec-scoring-panel.open{display:block}
.rec-scoring-cat{
  margin-bottom:8px;border:1px solid var(--bg4);border-radius:var(--radius-sm);
  overflow:hidden;
}
.rec-scoring-cat-header{
  padding:7px 10px;background:var(--bg4);font-size:.79rem;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.rec-scoring-cat-header .cat-score{color:var(--accent);margin-left:auto}
.rec-scoring-dim{
  padding:6px 10px 6px 18px;font-size:.74rem;border-bottom:1px solid var(--bg4);
  line-height:1.5;
}
.rec-scoring-dim:last-child{border-bottom:none}
.rec-scoring-dim .dim-head{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
}
.rec-scoring-dim .dim-name{font-weight:600;color:var(--text);font-size:.78rem}
.rec-scoring-dim .dim-wbar{font-size:.66rem;color:var(--text3)}
.rec-scoring-dim .dim-calc{font-size:.69rem;color:var(--text2);margin-top:2px}
.rec-scoring-dim .dim-formula{font-size:.66rem;color:var(--text3);font-family:monospace;margin-top:1px}
.rec-scoring-dim .dim-raw{font-size:.64rem;color:var(--text3);margin-top:1px}
.rec-scoring-dim .dim-trace-explain{font-size:.65rem;color:var(--text2);margin:1px 0 3px 15px;line-height:1.45}
.rec-scoring-dim .dim-explain{
  font-size:.67rem;color:var(--text2);margin-top:4px;padding:4px 7px;
  border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent);
  border-radius:0 4px 4px 0;
}
html.embed-mode header{display:none}
html.embed-mode main{padding-top:12px}
.dim-row{cursor:pointer;transition:background 0.15s;padding:3px 4px;border-radius:4px;margin:0 -4px}
.dim-row:hover{background:rgba(255,255,255,0.04)}
.scoring-details{margin-top:8px}
.scoring-details summary{font-size:0.75rem;color:var(--text2);cursor:pointer;font-weight:500;user-select:none}
.scoring-dim{font-size:0.68rem;color:var(--text3);margin-top:6px;line-height:1.5}

/* Score tooltip */
.score-tooltip{
  position:fixed;z-index:9999;max-width:380px;min-width:200px;
  background:rgba(20,24,36,0.96);color:#e8eaf0;
  border:1px solid rgba(255,255,255,0.12);border-radius:10px;
  padding:12px 15px;font-size:0.78rem;line-height:1.55;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  pointer-events:none;opacity:0;transition:opacity 0.18s;
  backdrop-filter:blur(8px);
}
.score-tooltip.visible{opacity:1}
.score-tooltip .tt-title{font-weight:700;font-size:0.88rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.score-tooltip .tt-title .tt-score{font-size:1.1rem;color:var(--accent)}
.score-tooltip .tt-formula{color:var(--text2);font-size:0.73rem;margin-bottom:6px;padding:6px 8px;background:rgba(255,255,255,0.04);border-radius:6px;font-family:'SF Mono','Cascadia Code',Consolas,monospace}
.score-tooltip .tt-raw{font-size:0.7rem;color:var(--text3)}
.score-tooltip .tt-raw span{display:inline-block;margin-right:10px;white-space:nowrap}
.score-tooltip .tt-weight{color:var(--text3);font-size:0.7rem;margin-top:4px}

.dim-row{cursor:pointer;transition:background 0.15s;padding:3px 4px;border-radius:4px;margin:0 -4px}
.dim-row:hover{background:rgba(255,255,255,0.04)}

/* VRAM + card calculation breakdown */
.calc-breakdown{margin:0 0 8px;border:1px solid rgba(45,140,240,.22);background:rgba(45,140,240,.035);border-radius:8px;font-size:.77rem;overflow:hidden}
.calc-breakdown summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;color:var(--accent);cursor:pointer;user-select:none;font-size:.91rem}
.calc-breakdown summary::-webkit-details-marker{display:none}.calc-breakdown summary::marker{display:none}
.calc-breakdown summary .calc-arrow{font-size:.62rem;transition:transform .2s}.calc-breakdown[open] summary .calc-arrow{transform:rotate(90deg)}
.calc-breakdown summary .calc-summary-text{margin-left:auto;color:var(--text2);font-weight:500;font-size:.7rem}
.calc-body{padding:0 12px 12px;border-top:1px solid rgba(45,140,240,.14)}
.calc-inputs{display:flex;gap:5px;flex-wrap:wrap;padding:9px 0 7px}.calc-chip{padding:2px 7px;border-radius:10px;background:var(--bg4);color:var(--text2);font-size:.68rem}
.calc-moe-note{display:flex;gap:7px;margin:2px 0 9px;padding:7px 9px;border-radius:6px;background:rgba(245,158,11,.09);color:var(--orange);font-size:.71rem;line-height:1.45}
.calc-section-title{font-weight:650;color:var(--text);font-size:.77rem;margin:9px 0 5px}
.calc-component{display:grid;grid-template-columns:minmax(130px,.7fr) minmax(280px,2.3fr) auto;gap:10px;align-items:center;padding:7px 9px;margin:4px 0;background:var(--bg3);border-radius:6px}
.calc-component .cc-name{color:var(--text2);font-size:.71rem}.calc-component .cc-formula{color:var(--text);font-family:'SF Mono','Cascadia Code',Consolas,monospace;font-size:.7rem;word-break:break-word}.calc-component .cc-result{color:var(--accent);font-weight:700;white-space:nowrap}
.calc-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.calc-tiers.two{grid-template-columns:repeat(2,minmax(0,1fr))}.calc-tier{padding:8px 9px;background:var(--bg3);border-radius:6px}.calc-tier .ct-name{font-size:.68rem;color:var(--text3)}.calc-tier .ct-value{font-size:.88rem;font-weight:700;color:var(--text);margin:2px 0}.calc-tier .ct-formula{font-size:.66rem;color:var(--text2);line-height:1.45;word-break:break-word}
.calc-total-line{margin:6px 0 2px;padding:7px 9px;background:rgba(45,140,240,.08);border-radius:6px;color:var(--text);font-size:.72rem}.calc-total-line b{color:var(--accent)}
@media(max-width:800px){.calc-component{grid-template-columns:1fr}.calc-tiers,.calc-tiers.two{grid-template-columns:1fr}.calc-breakdown summary .calc-summary-text{display:none}}


/* Agent quick-chips panel */
.agent-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:calc(100vh - 140px);min-height:560px}
@media(max-width:900px){.agent-layout{grid-template-columns:1fr}}
.agent-chat-panel{display:flex;flex-direction:column;background:var(--bg2);border:var(--border);border-radius:var(--radius);overflow:visible;box-shadow:var(--shadow)}
.agent-chat-header{padding:10px 16px;border-bottom:var(--border);font-size:0.85rem;font-weight:600;display:flex;align-items:center;gap:8px;flex-shrink:0}
.agent-chat-header .dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:0.8rem;line-height:1.5;word-break:break-word}
.chat-msg.tool{background:rgba(59,130,246,0.06);border:1px solid rgba(59,130,246,0.15);color:var(--blue);font-size:0.7rem;max-width:90%}
.chat-msg.tool pre{font-size:0.65rem;max-height:120px;overflow:auto;margin:4px 0 0;padding:4px 6px;background:var(--bg2);border-radius:4px;white-space:pre-wrap}
#chat-input-area{display:flex;gap:8px;padding:10px 12px;border-top:var(--border);flex-shrink:0}
#chat-input{flex:1;background:var(--bg3);color:var(--text);border:var(--border);border-radius:20px;padding:8px 14px;font-size:0.82rem;outline:none}
#chat-input:focus{border-color:var(--accent)}
#chat-send{background:var(--accent2);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-weight:600;cursor:pointer;font-size:0.82rem;transition:var(--transition)}
#chat-send:hover{background:var(--accent)}
#chat-send:disabled{opacity:0.5;cursor:default}
.chat-typing{display:flex;gap:4px;padding:8px 12px}
.chat-typing span{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:chatBounce 1.2s infinite}
.chat-typing span:nth-child(2){animation-delay:0.2s}
.chat-typing span:nth-child(3){animation-delay:0.4s}
@keyframes chatBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}

/* Agent quick-chips panel */
.agent-quick-panel{background:var(--bg2);border:var(--border);border-radius:var(--radius);padding:16px;overflow-y:auto}
.agent-quick-panel h3{font-size:0.85rem;margin-bottom:10px;color:var(--text2)}
.quick-chip{display:block;width:100%;text-align:left;background:var(--bg3);border:var(--border);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:6px;cursor:pointer;color:var(--text);font-size:0.78rem;transition:var(--transition)}
.quick-chip:hover{background:var(--bg4);border-color:var(--accent)}
.quick-chip .qc-title{font-weight:600;margin-bottom:2px}
.quick-chip .qc-desc{color:var(--text3);font-size:0.68rem}
.chat-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.chat-msg.assistant{align-self:flex-start;background:var(--bg3);color:var(--text);border-bottom-left-radius:4px}

/* ── Status cards ── */
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.stat-card{
  background:var(--bg2);border:var(--border);border-radius:var(--radius);
  padding:14px;text-align:center;
}
.stat-card .num{font-size:1.8rem;font-weight:700;color:var(--accent)}
.stat-card .lbl{font-size:0.75rem;color:var(--text2);margin-top:3px}

/* ── Loading & Empty ── */
.loading{text-align:center;padding:36px;color:var(--text3)}
.spinner{
  width:30px;height:30px;border:3px solid var(--bg4);border-top-color:var(--accent);
  border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 10px;
}@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px;color:var(--text3);font-size:0.85rem}
.error{background:rgba(239,68,68,0.06);color:var(--red);padding:10px 14px;
  border-radius:var(--radius-sm);font-size:0.8rem;margin-bottom:10px;border:1px solid rgba(239,68,68,0.15)}
.info{background:rgba(59,130,246,0.06);color:var(--blue);padding:10px 14px;
  border-radius:var(--radius-sm);font-size:0.8rem;margin-bottom:10px;border:1px solid rgba(59,130,246,0.12)}

/* ── Provenance field history ── */
.prov-field{border-bottom:var(--border);padding:8px 0}
.prov-field:last-child{border-bottom:none}
.prov-field-header{padding:4px 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prov-field-history{padding-left:12px;border-left:2px solid var(--bg4);word-break:break-word;overflow-wrap:break-word}
.prov-history-row{padding:4px 0;border-bottom:1px dashed var(--bg4)}
.prov-history-row:last-child{border-bottom:none}

/* ── Responsive ── */
@media(max-width:768px){
  .header-inner{flex-wrap:wrap;height:auto;padding:10px 0;gap:6px}
  nav{order:3;width:100%;overflow-x:auto}
  .card-grid{grid-template-columns:1fr}
  .filters{flex-direction:column}
  .filters input{min-width:100%}
  .recommend-form{grid-template-columns:1fr}
  .detail-panel{margin:8px 0}
}
/* ═══════════ Methodology & VRAM Tab Styling ═══════════ */
/* ── Hero ── */
.mg-hero{
  background:linear-gradient(135deg, var(--bg2) 0%, rgba(45,140,240,0.06) 50%, var(--bg2) 100%);
  border:1px solid var(--bg4); border-radius:var(--radius);
  padding:28px 32px; margin-bottom:24px;
}
.mg-hero h2{font-size:1.5rem; margin:0 0 6px; color:var(--text); letter-spacing:-0.01em}
.mg-hero .mg-ver{
  display:inline-block; font-size:0.7rem; color:#fff; font-weight:600;
  background:var(--accent); padding:3px 12px; border-radius:12px;
  vertical-align:middle; margin-left:8px;
}
.mg-hero p{color:var(--text2); font-size:0.85rem; margin:0}

/* ── Section title ── */
.mg-section-title{
  display:flex; align-items:center; gap:10px;
  font-size:0.95rem; font-weight:700; color:var(--text);
  margin-bottom:14px; padding-bottom:10px;
  border-bottom:2px solid var(--bg4);
}
.mg-section-title .mg-section-icon{
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  border-radius:10px; font-size:1.1rem; flex-shrink:0;
}

/* ── Formula cards grid ── */
.mg-formula-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:12px; margin-bottom:24px;
}
.mg-formula-card{
  background:var(--bg2); border:1px solid var(--bg4); border-radius:var(--radius);
  padding:0; overflow:hidden;
  transition:all 0.2s ease; cursor:default;
}
.mg-formula-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover)}
.mg-formula-card .mg-fc-head{
  display:flex; align-items:center; gap:8px;
  padding:10px 14px; font-size:0.72rem; font-weight:600;
  letter-spacing:0.03em; text-transform:uppercase;
}
.mg-formula-card .mg-fc-body{
  padding:12px 16px; display:flex; flex-direction:column; gap:6px;
}
.mg-formula-card .mg-fc-param{
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.72rem; color:var(--text2);
  padding:4px 8px; background:var(--bg3); border-radius:4px;
}
.mg-formula-card .mg-fc-param code{color:var(--text); font-size:0.75rem; font-weight:600}
.mg-fc-label{font-size:0.7rem; color:var(--text3); font-weight:500}
.mg-fc-vram .mg-fc-head{background:rgba(59,130,246,0.08); color:var(--blue); border-left:3px solid var(--blue)}
.mg-fc-compute .mg-fc-head{background:rgba(245,158,11,0.08); color:var(--orange); border-left:3px solid var(--orange)}
.mg-fc-mfu .mg-fc-head{background:rgba(16,185,129,0.08); color:var(--green); border-left:3px solid var(--green)}
.mg-fc-inference .mg-fc-head{background:rgba(139,92,246,0.08); color:var(--purple); border-left:3px solid var(--purple)}

/* ── Category cards ── */
.mg-cat-grid{
  display:grid; grid-template-columns:repeat(4, minmax(0,1fr));
  gap:16px; margin-bottom:24px;
}
.mg-cat-card{
  background:var(--bg2); border:1px solid var(--bg4); border-radius:var(--radius);
  overflow:hidden; transition:all 0.2s ease;
}
.mg-cat-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover)}
.mg-cat-card .mg-cc-top{
  padding:18px 20px 14px;
  border-bottom:1px solid var(--bg4);
}
.mg-cat-card:nth-child(1) .mg-cc-top{background:linear-gradient(135deg, rgba(45,140,240,0.07), transparent)}
.mg-cat-card:nth-child(2) .mg-cc-top{background:linear-gradient(135deg, rgba(245,158,11,0.07), transparent)}
.mg-cat-card:nth-child(3) .mg-cc-top{background:linear-gradient(135deg, rgba(16,185,129,0.07), transparent)}
.mg-cat-card:nth-child(4) .mg-cc-top{background:linear-gradient(135deg, rgba(139,92,246,0.07), transparent)}
.mg-cat-card .mg-cc-icon{font-size:1.6rem; margin-bottom:4px}
.mg-cat-card .mg-cc-title-row{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.mg-cat-card .mg-cc-title{font-weight:700; font-size:1.05rem; color:var(--text)}
.mg-cat-card .mg-cc-weight{
  font-size:0.73rem; font-weight:700; padding:3px 12px;
  border-radius:12px; letter-spacing:0.02em;
}
.mg-cat-card:nth-child(1) .mg-cc-weight{background:rgba(45,140,240,0.12); color:var(--accent)}
.mg-cat-card:nth-child(2) .mg-cc-weight{background:rgba(245,158,11,0.12); color:var(--orange)}
.mg-cat-card:nth-child(3) .mg-cc-weight{background:rgba(16,185,129,0.12); color:var(--green)}
.mg-cat-card:nth-child(4) .mg-cc-weight{background:rgba(139,92,246,0.12); color:var(--purple)}
.mg-cat-card .mg-cc-desc{color:var(--text2); font-size:0.78rem; margin-top:6px}
.mg-cat-card .mg-cc-body{padding:6px 12px 12px}

/* ── Dimension items inside cat card ── */
.mg-dim-item{
  display:flex; align-items:flex-start; gap:12px;
  padding:10px 12px; margin:4px 0;
  background:var(--bg3); border-radius:var(--radius-sm);
  transition:background 0.15s;
}
.mg-dim-item:hover{background:var(--bg4)}
.mg-dim-item .mg-di-bar{
  width:4px; height:100%; min-height:44px; border-radius:2px;
  flex-shrink:0; align-self:stretch;
}
.mg-dim-item:nth-child(odd) .mg-di-bar{background:var(--accent)}
.mg-dim-item:nth-child(even) .mg-di-bar{background:var(--purple)}
.mg-dim-item .mg-di-content{flex:1; min-width:0}
.mg-dim-item .mg-di-name{
  font-weight:600; font-size:0.84rem; color:var(--text);
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}
.mg-dim-item .mg-di-name-en{font-weight:400; font-size:0.65rem; color:var(--text3)}
.mg-dim-item .mg-di-desc{color:var(--text2); font-size:0.72rem; margin-top:2px}
.mg-dim-item .mg-di-meta{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap}
.mg-dim-item .mg-di-tag{
  font-size:0.64rem; padding:2px 10px; border-radius:4px;
  background:var(--bg4); color:var(--text2); font-weight:500;
}
.mg-dim-item .mg-di-tag.primary{
  background:rgba(45,140,240,0.1); color:var(--accent); font-weight:600;
}

/* ── Weight matrix table ── */
.mg-weight-card{
  background:var(--bg2); border:1px solid var(--bg4); border-radius:var(--radius);
  overflow:hidden; margin-bottom:24px;
}
.mg-weight-card .mg-wc-head{
  padding:14px 20px; border-bottom:1px solid var(--bg4);
  display:flex; align-items:center; gap:10px;
  font-weight:700; font-size:0.9rem; color:var(--text);
  background:var(--bg3);
}
.mg-weight-card .mg-wc-body{padding:20px; overflow-x:auto}
.mg-weight-table{width:100%; border-collapse:collapse; font-size:0.85rem}
.mg-weight-table thead th{
  padding:12px 18px; text-align:center; font-weight:600;
  font-size:0.78rem; border-bottom:2px solid var(--bg4);
  background:var(--bg2); position:sticky; top:0;
}
.mg-weight-table thead th:first-child{text-align:left}
.mg-weight-table tbody td{
  padding:12px 18px; text-align:center;
  border-bottom:1px solid var(--bg4);
  font-weight:500;
}
.mg-weight-table tbody td:first-child{text-align:left; font-weight:600}
.mg-weight-table tbody tr:hover{background:rgba(45,140,240,0.03)}
.mg-pill{
  display:inline-block; padding:4px 16px; border-radius:14px;
  font-weight:700; font-size:0.8rem; min-width:48px;
}
.mg-pill.blue{background:rgba(45,140,240,0.1); color:var(--accent)}
.mg-pill.orange{background:rgba(245,158,11,0.1); color:var(--orange)}
.mg-pill.green{background:rgba(16,185,129,0.1); color:var(--green)}
.mg-pill.purple{background:rgba(139,92,246,0.1); color:var(--purple)}

/* ── Constraints ── */
.mg-constraint-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px; margin-bottom:24px;
}
.mg-constraint-item{
  display:flex; align-items:flex-start; gap:10px;
  padding:14px 16px;
  background:rgba(239,68,68,0.03); border:1px solid rgba(239,68,68,0.12);
  border-radius:var(--radius-sm); border-left:3px solid var(--red);
  transition:all 0.15s;
}
.mg-constraint-item:hover{background:rgba(239,68,68,0.06); border-color:rgba(239,68,68,0.25)}
.mg-constraint-item .mg-ci-icon{
  color:var(--red); font-weight:700; font-size:0.85rem;
  flex-shrink:0; line-height:1.4;
}
.mg-constraint-item .mg-ci-text{font-size:0.82rem; color:var(--text); line-height:1.45}

/* ── Philosophy grid ── */
.mg-phil-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:10px; margin-bottom:16px;
}
.mg-phil-item{
  display:flex; gap:10px; align-items:flex-start;
  padding:14px 16px; background:var(--bg2);
  border:1px solid var(--bg4); border-radius:var(--radius-sm);
  transition:all 0.15s;
}
.mg-phil-item:hover{transform:translateY(-1px); box-shadow:var(--shadow-hover)}

<script>
/* ═══════════════════════════════════════════════════════════
   AISHPerf v0.5 — Dynamic component-based SPA
   ═══════════════════════════════════════════════════════════ */

const API = '/api/v1';
const STATE = { vendors: [], currentTab: 'chips' };
const EMBED_MODE = document.documentElement.classList.contains('embed-mode');

function $(id){return document.getElementById(id)}
function show(el,disp=''){el.style.display=disp}
function hide(el){el.style.display='none'}

/* ═══ Chat Widget ═══ */
const CHAT_HISTORY = []; // in-memory only, no history persistence

async function sendChat(){
  const input=$('chat-input'), msg=input.value.trim();
  if(!msg)return;
  input.value='';
  input.disabled=true;
  $('chat-send').disabled=true;

  // Show user message
  appendChatMsg('user',msg);
  CHAT_HISTORY.push({role:'user',content:msg});

  // Show typing indicator
  const typing=appendTyping();

  try{
    const resp=await fetch(`${API}/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:CHAT_HISTORY})
    });
    if(!resp.ok){throw new Error(resp.status+': '+await resp.text())}

    let assistantText='';
    let currentAssistantEl=null;

    const reader=resp.body.getReader();
    const decoder=new TextDecoder('utf-8');
    let buffer='';

    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      // Use stream:true so incomplete multi-byte characters at chunk boundary
      // are held back and completed by the next chunk
      buffer += decoder.decode(value, {stream: !done});
      const lines=buffer.split('\n');
      buffer=(done ? '' : lines.pop())||'';

      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        const data=line.slice(6).trim();
        if(data==='[DONE]')break;
        try{
          const d=JSON.parse(data);
          if(d.type==='text'){
            assistantText+=d.content;
            if(!currentAssistantEl){
              typing.remove();
              currentAssistantEl=appendChatMsg('assistant','');
            }
            currentAssistantEl.innerHTML=renderMarkdown(assistantText);
            $('chat-messages').scrollTop=$('chat-messages').scrollHeight;
          }else if(d.type==='tool_call'){
            // Skip — tool process is invisible to user
          }else if(d.type==='tool_start'){
            // Skip — tool process is invisible to user
          }else if(d.type==='tool_result'){
            // Skip — tool process is invisible to user
          }
        }catch(e){}
      }
    }

    // Cleanup on completion
    if(assistantText){
      // Final sanitize pass: remove any XML tags that slipped through
      assistantText = assistantText.replace(/<[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*\/?\s*>/gi,'');
      // Also remove full <tag>...</tag> blocks that might have snuck in
      assistantText = assistantText.replace(/<[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*>[\s\S]*?<\/[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*>/gi,'');
      CHAT_HISTORY.push({role:'assistant',content:assistantText});
    }
  }catch(e){
    typing.remove();
    appendChatMsg('assistant','抱歉，请求出错了: '+esc(e.message));
  }

  input.disabled=false;
  $('chat-send').disabled=false;
  input.focus();
}

function appendChatMsg(role,content){
  const msgs=$('chat-messages');
  const el=document.createElement('div');
  el.className='chat-msg '+role;
  el.innerHTML=content;
  msgs.appendChild(el);
  msgs.scrollTop=msgs.scrollHeight;
  return el;
}

function appendTyping(){
  const msgs=$('chat-messages');
  const el=document.createElement('div');
  el.className='chat-typing';
  el.innerHTML='<span></span><span></span><span></span>';
  msgs.appendChild(el);
  msgs.scrollTop=msgs.scrollHeight;
  return el;
}

function renderMarkdown(text){
  // Safety net: strip all XML/DSML tool-call tags and their content
  // Matches <function_calls>, <DSML|function_calls>, <invoke>, <parameter>, <tool_calls> etc.
  let html=text.replace(/<[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*>[\s\S]*?<\/[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*>/gi,'');
  html=html.replace(/<\/?[^>]*?\b(?:function_calls|tool_calls|invoke|parameter)\b[^>]*\/?>/gi,'');

  // STRIP <__SYS-... and other hallucinated OpenAI tool call markers
  html=html.replace(/<\s*__+[a-zA-Z_][^>]*\/?\s*>/g,'');

  html=esc(html);
  html=html.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  html=html.replace(/\*(.+?)\*/g,'<i>$1</i>');
  html=html.replace(/`(.+?)`/g,'<code>$1</code>');
  html=html.replace(/\\n/g,'<br>');
  html=html.replace(/\n/g,'<br>');
  return html;
}

/* ═══ Generic Autocomplete (used by chip/model search + recommend) ═══ */
let CHIP_LIST = [];   // { id, name, vendor, type, arch, vram, ... }
let MODEL_LIST = [];  // { id, author, params, arch, tag, downloads }

async function ensureChipList(){
  if(CHIP_LIST.length) return;
  // Load all chips in fewer, larger requests
  const BATCH = 1000;
  let allChips = [];
  for(let off=0; off<2000; off+=BATCH){
    try {
      const data = await fetchJSON(`${API}/chips?limit=${BATCH}&offset=${off}&tier=all`);
      if(data._error || !data.chips || !data.chips.length) break;
      allChips = allChips.concat(data.chips);
      if(data.chips.length < BATCH) break; // last page
    } catch(e) { break; }
  }
  CHIP_LIST = allChips.map(c=>({
    id: c.id, name: c.chip_model||'', vendor: c.vendor_display||'',
    type: c.chip_type||'', arch: c.architecture||'', vram: c.vram_gb||'',
    tier: '',
  })).filter(c=>c.name).sort((a,b)=>a.name.localeCompare(b.name));
}

async function ensureModelList(){
  if(MODEL_LIST.length) return;
  let allModels = [];
  const BATCH = 2000; // API now allows 2000
  for(let off=0; off<2000; off+=BATCH){
    try {
      const data = await fetchJSON(`${API}/models?limit=${BATCH}&offset=${off}`);
      if(data._error || !data.models || !data.models.length) break;
      allModels = allModels.concat(data.models);
      if(data.models.length < BATCH) break;
    } catch(e) { break; }
  }
  MODEL_LIST = allModels.map(m=>({
    id: m.model_id||m.id||'', author: m.author||'',
    params: m.total_params_b||'?', arch: m.architecture_family||'',
    tag: m.pipeline_tag||'', downloads: parseInt(m.downloads)||0,
  })).filter(m=>m.id).sort((a,b)=>{
    const pa=parseFloat(a.params)||0, pb=parseFloat(b.params)||0;
    return pb-pa||(b.downloads||0)-(a.downloads||0);
  });
}

/**
 * Attach autocomplete behaviour to any text input.
 * @param inputId       id of the <input>
 * @param dropdownId    id of the <div> that holds .ac-item children
 * @param source        'chips' | 'models' (which list to search)
 * @param onPick(id)    called when user clicks/enters an item
 * @param multi         if true, clear input after pick & keep dropdown open
 * @param getPickName   optional — override display name for chip list (default name)
 */
function initAutocomplete(inputId, dropdownId, source, onPick, multi=false, getPickName=null){
  const inp = $(inputId), dd = $(dropdownId);
  let activeIdx = -1, lastQuery = '', _suggestTimer = null, _cachedQuery = '';

  // Store onPick on the input element so pickAcItem can call it
  inp._acOnPick = onPick;
  inp._acMulti = multi;

  function items(){ return dd.querySelectorAll('.ac-item'); }

  async function suggest(){
    const q = (inp.value||'').toLowerCase().trim();
    // Skip if same query already resolved (debounce guard)
    if(q === _cachedQuery) return;
    _cachedQuery = q;
    // Debounce: wait 150ms after last keystroke before running expensive filter
    clearTimeout(_suggestTimer);
    activeIdx = -1;
    if(!q || q.length < 1){ dd.classList.remove('open'); return; }
    _suggestTimer = setTimeout(async () => {
      const currentQ = (inp.value||'').toLowerCase().trim();
      if(!currentQ || currentQ.length < 1){ dd.classList.remove('open'); return; }
      if(currentQ === lastQuery) return;
      lastQuery = currentQ;

    let matches;
    if(source==='chips'){
      await ensureChipList();
      matches = CHIP_LIST.filter(c=>
        c.name.toLowerCase().includes(q) || c.vendor.toLowerCase().includes(q) || c.arch.toLowerCase().includes(q)
      ).slice(0,15);
    } else {
      await ensureModelList();
      matches = MODEL_LIST.filter(m=>
        m.id.toLowerCase().includes(q) || m.author.toLowerCase().includes(q)
      ).slice(0,15);
    }

    if(!matches.length){ dd.classList.remove('open'); return; }

    dd.innerHTML = matches.map((m,i)=>{
      let name = source==='chips' ? (getPickName?getPickName(m):m.name) : m.id;
      let meta = source==='chips'
        ? `${esc(m.vendor)} · ${esc(m.type||'')} · VRAM ${m.vram||'?'}GB`
        : `${esc(m.params)}B ${esc(m.arch||'')} · ${esc((m.downloads||0)>1e6?(m.downloads/1e6).toFixed(1)+'M':(m.downloads||0)>1e3?(m.downloads/1e3).toFixed(1)+'K':m.downloads)}↓`;
      let tag = source==='chips'
        ? (m.tier==='datacenter'?`<span class="ac-tag" style="background:rgba(129,140,248,0.15);color:var(--accent)">数据中心</span>`:'')
        : (m.tag?`<span class="ac-tag" style="background:rgba(59,130,246,0.08);color:var(--blue)">${esc(m.tag)}</span>`:'');
      // Use chip name (not numeric id) for the pick value
      let pickValue = source==='chips' ? name : m.id;
      return `<div class="ac-item" data-idx="${i}" data-name="${esc(pickValue)}">
        <span class="ac-name">${esc(name)}</span>${tag}<span class="ac-meta">${meta}</span>
      </div>`;
    }).join('');
    dd.classList.add('open');
    });  // end setTimeout
  }  // end suggest()

  // keyboard navigation
  inp.addEventListener('keydown', async function(e){
    const all = items();
    if(e.key==='ArrowDown'){
      e.preventDefault();
      if(!all.length){ await suggest(); return; }
      activeIdx = Math.min(activeIdx+1, all.length-1);
      all.forEach(el=>el.classList.remove('active'));
      if(all[activeIdx]) {
        all[activeIdx].classList.add('active');
        all[activeIdx].scrollIntoView({block:'nearest'});
      }
    } else if(e.key==='ArrowUp'){
      e.preventDefault();
      activeIdx = Math.max(activeIdx-1, 0);
      all.forEach(el=>el.classList.remove('active'));
      if(all[activeIdx]) all[activeIdx].classList.add('active');
    } else if(e.key==='Enter'){
      e.preventDefault();
      if(activeIdx>=0 && all[activeIdx]){
        const name = all[activeIdx].dataset.name;
        activeIdx = -1;
        if(!multi) inp.value = name;          // update input so _wireEnterFallback sees the picked value
        inp._acPickFired = true;              // suppress duplicate blur/Enter fires
        setTimeout(() => { if(inp) inp._acPickFired = false; }, 300);
        onPick(name);
        if(!multi) dd.classList.remove('open');
      } else {
        dd.classList.remove('open');
        activeIdx = -1;
      }
    } else if(e.key==='Escape'){
      dd.classList.remove('open');
      activeIdx = -1;
    }
  });

  inp.addEventListener('input', suggest);
  inp.addEventListener('focus', suggest);

  // Close on click outside
  document.addEventListener('click', e=>{
    if(!e.target.closest(`#${dropdownId}`) && !e.target.closest(`#${inputId}`)){
      dd.classList.remove('open'); activeIdx = -1;
    }
  });
}

/* Global delegated mousedown on all .ac-dropdown children */
document.addEventListener('mousedown', function(e){
  const item = e.target.closest('.ac-item');
  if(!item) return;
  const dd = item.closest('.ac-dropdown');
  if(!dd) return;
  e.preventDefault();
  const name = item.dataset.name;
  const wrapper = dd.closest('.autocomplete-wrapper');
  const inp = wrapper ? wrapper.querySelector('.ac-input') : null;
  if(!inp || !name) return;
  // Call the stored onPick callback
  if(inp._acOnPick) {
    inp._acOnPick(name);
    if(!inp._acMulti) inp.value = name;
  } else {
    inp.value = name;
  }
  dd.classList.remove('open');
  inp._acPickFired = true;
  setTimeout(() => { if(inp) inp._acPickFired = false; }, 300);
});

/**
 * Wire the onPick callback to fire on both:
 * - Keyboard Enter with dropdown item selected (handled in initAutocomplete keydown)
 * - Mouse click on dropdown item (pickAcItem + acPickFired flag)
 */
function _wireEnterFallback(inputId, onPick, multi){
  const inp = $(inputId);
  if(!inp) return;
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      // If dropdown was just clicked (acPickFired), let the click do its thing
      if(inp._acPickFired){ inp._acPickFired = false; return; }
      // If dropdown is open and has a selection, the initAutocomplete Enter handler runs first
      // This handler runs AFTER, so check if dropdown is still open
      const dd = inp.closest('.autocomplete-wrapper')?.querySelector('.ac-dropdown');
      if(dd && dd.classList.contains('open')) return; // initAutocomplete handler will handle it
      // No dropdown open — user just pressed Enter in the input
      const val = inp.value.trim();
      if(val) {
        inp._acPickFired = true;              // suppress duplicate blur fire
        setTimeout(() => { if(inp) inp._acPickFired = false; }, 300);
        onPick(val);
      }
    }
  });
  // ── Focus/blur based change detection ──
  // Only fire onPick on blur when the user actually modified the text,
  // not on every navigation (tab switch, card click, etc.).
  let _focusVal = '';
  inp.addEventListener('focus', function(){
    _focusVal = inp.value;
  });
  // Fire onPick on blur if user typed a value manually and left the field
  inp.addEventListener('blur', function(){
    setTimeout(() => {
      const dd2 = inp.closest('.autocomplete-wrapper')?.querySelector('.ac-dropdown');
      if(dd2 && dd2.classList.contains('open')) return; // dropdown still open, mousedown will fire
      if(inp._acPickFired) return; // already handled by pick
      const val = inp.value.trim();
      if(val && val !== _focusVal) onPick(val);
    }, 150);
  });
}

function esc(s){
  if(!s&&s!==0)return'';
  const d=document.createElement('div');d.textContent=String(s);return d.innerHTML;
}
function fmtNum(n){
  if(!n)return'?';n=parseInt(n);if(n>1e9)return (n/1e9).toFixed(1)+'B';
  if(n>1e6)return (n/1e6).toFixed(1)+'M';if(n>1e3)return (n/1e3).toFixed(1)+'K';
  return n.toLocaleString();
}
function fmtVal(v, unit=''){
  if(v===null||v===undefined||v==='')return'—';
  return esc(v)+(unit?' '+unit:'');
}

async function fetchJSON(url, opts={}){
  try{

    return await r.json();

}

const CHIP_PAGE_STATE = { page: 1, limit: 18, params: '', count: 0 };
const MODEL_PAGE_STATE = { page: 1, limit: 18, params: '', count: 0 };
const COMPAT_PAGE_STATE = { page: 1, limit: 10, params: '', count: 0 };
let _pager_click = false; // flag: avoid resetting page when pager clicks

function searchByState(){
  // Dispatch based on which panel is visible
  _pager_click = true;
  const tab = document.querySelector('.tab-panel.active');
  if(tab && tab.id === 'tab-models') { searchModels(); }
  else if(tab && tab.id === 'tab-compat') { searchCompat(); }
  else { searchChips(); }
}

function buildPager(cur, limit, total, stateVar){
  if(total <= limit) return '';
  var totalPages = Math.ceil(total / limit);
  var pages = [];
  for(var i=1; i<=totalPages; i++){
    if(i===1 || i===totalPages || (i>=cur-2 && i<=cur+2)) pages.push(i);
    else if(pages[pages.length-1]!=='...') pages.push('...');
  }
  return '<div class="pager" style="display:flex;justify-content:center;align-items:center;gap:4px;margin-top:16px;flex-wrap:wrap">'+
    '<button class="btn pager-btn" style="min-width:32px;padding:4px 8px" '+(cur<=1?'disabled':'')+' onclick="'+stateVar+'='+1+';searchByState()">«</button>'+
    '<button class="btn pager-btn" style="min-width:32px;padding:4px 8px" '+(cur<=1?'disabled':'')+' onclick="'+stateVar+'='+(cur-1)+';searchByState()">‹</button>'+
    pages.map(function(p){return p==='...'?'<span style="padding:4px 8px;color:var(--text3)">...</span>':'<button class="btn pager-btn '+(p===cur?'active':'')+'" style="min-width:32px;padding:4px 8px;'+(p===cur?'background:var(--accent2);color:#fff;font-weight:700':'')+'" onclick="'+stateVar+'='+p+';searchByState()">'+p+'</button>';}).join('')+
    '<button class="btn pager-btn" style="min-width:32px;padding:4px 8px" '+(cur>=totalPages?'disabled':'')+' onclick="'+stateVar+'='+(cur+1)+';searchByState()">›</button>'+
    '<button class="btn pager-btn" style="min-width:32px;padding:4px 8px" '+(cur>=totalPages?'disabled':'')+' onclick="'+stateVar+'='+totalPages+';searchByState()">»</button>'+
  '</div>';
}

async function searchModels(){
  if(!_pager_click){MODEL_PAGE_STATE.page=1;}
  _pager_click = false;
  const loading=$('model-loading'), results=$('model-results'), sum=$('model-summary');
  show(loading);results.innerHTML='';sum.textContent='';

  const params = new URLSearchParams();
  const s=($('model-search')||{}).value; if(s&&s.trim())params.set('search',s.trim());
  const a=($('model-arch')||{}).value; if(a)params.set('architecture',a);
  const pm=($('model-params-min')||{}).value; if(pm)params.set('params_min',pm);
  const fc=($('model-for-chip')||{}).value; if(fc&&fc.trim())params.set('for_chip',fc.trim());
  params.set('limit', String(MODEL_PAGE_STATE.limit));
  params.set('offset', String((MODEL_PAGE_STATE.page - 1) * MODEL_PAGE_STATE.limit));

  const data = await fetchJSON(`${API}/models?${params}`);
  hide(loading);
  if(data._error){results.innerHTML=`<div class="error">${esc(data._error)}</div>`;return}

  sum.innerHTML = `<span style="font-size:0.8rem;color:var(--text3)">找到 <b>${data.count}</b> 个模型`+
    (data.count > MODEL_PAGE_STATE.limit ? ` · 第 <b>${MODEL_PAGE_STATE.page}</b> / <b>${Math.ceil(data.count/MODEL_PAGE_STATE.limit)}</b> 页` : '')+
    `</span>`;
  if(!data.models||!data.models.length){results.innerHTML='<div class="empty">未找到匹配的模型</div>';return}

  results.innerHTML = data.models.map(m=>`
    <div class="card" onclick="openModelProfile('${m.id}')">
      <div class="card-header">
        <span class="card-vendor vendor-foreign">${esc(m.author||'?')}</span>
        ${m.architecture_family?`<span class="tag arch">${esc(m.architecture_family)}</span>`:''}
        ${m.pipeline_tag?`<span class="tag compat">${esc(m.pipeline_tag)}</span>`:''}
      </div>
      <div class="card-model" style="font-size:0.9rem;word-break:break-all">${esc(m.model_id)}</div>
      <div class="card-stats">
        <div class="card-stat"><span class="label">参数量</span><span class="value">${fmtVal(m.total_params_b,'B')}</span></div>
        <div class="card-stat"><span class="label">下载</span><span class="value">${fmtNum(m.downloads)}</span></div>
        <div class="card-stat"><span class="label">点赞</span><span class="value">${fmtNum(m.likes)}</span></div>
        <div class="card-stat"><span class="label">库</span><span class="value">${esc(m.library_name||'')}</span></div>
      </div>
    </div>
  `).join('');

  results.innerHTML += buildPager(MODEL_PAGE_STATE.page, MODEL_PAGE_STATE.limit, data.count, 'MODEL_PAGE_STATE.page');
}

// ── Shared provenance renderer for both chip & model detail ──
function renderFieldProvenance(fp) {
  if(!fp || Object.keys(fp).length===0) return '';
  const fieldsByGroup = {};
  // Group by source official/non-official
  const officialFields = [], unofficialFields = [];
  Object.entries(fp).forEach(([fn, fi]) => {
    const history = fi.history || [];
    const isOfficial = history.length > 0 && history[0].is_official === '1';
    (isOfficial ? officialFields : unofficialFields).push([fn, fi]);
  });
  const allFields = [...officialFields, ...unofficialFields];
  const fieldsHtml = allFields.map(([fn, fi]) => {
    const label = fi.field_label || FIELD_LABELS[fn] || fn;
    const isOfficial = fi.history && fi.history[0] && fi.history[0].is_official === '1';
    const historyRows = fi.history.map(h => `
      <div class="prov-history-row">
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <span style="color:var(--accent);font-weight:600;min-width:60px">${esc(String(h.new_value||'').slice(0,60))}</span>
          ${h.old_value ? `<span style="color:var(--text3)">← ${esc(String(h.old_value).slice(0,40))}</span>` : ''}
        </div>
        <div style="font-size:0.65rem;color:var(--text3);margin-top:2px">
          <span class="prov-src">${esc((h.source_url||'').slice(0,100))}</span>
          <span> · ${esc(h.source_type||'')}</span>
          <span> · ${esc(h.confidence||'')}</span>
          ${h.is_official==='1'?' <span style="color:var(--green)">✓官方</span>':''}
          <span style="float:right">${esc((h.updated_at||'').slice(0,16))}</span>
        </div>
      </div>
    `).join('');
    return `<div class="prov-field">
      <div class="prov-field-header">
        <b>${esc(label)}</b> <code style="color:var(--text3);font-size:0.7rem">${esc(fn)}</code>
        ${isOfficial?' <span style="color:var(--green);font-size:0.68rem;font-weight:600">✓官方</span>':' <span style="color:var(--orange);font-size:0.68rem">⚠非官方</span>'}
        ${fi.update_count>1?`<span style="color:var(--text3);font-size:0.65rem"> (${fi.update_count}次变更)</span>`:''}
      </div>
      <div class="prov-field-history">${historyRows}</div>
    </div>`;
  }).join('');

  return `<div class="group collapsed">
    <div class="group-header" onclick="this.parentElement.classList.toggle('collapsed')">📋 字段来源追溯 (${allFields.length}个字段 · ${officialFields.length}官方)</div>
    <div class="group-body" style="grid-template-columns:1fr;max-height:44vh;overflow-y:auto;overflow-x:hidden;padding:8px 12px">
      ${fieldsHtml}
    </div></div>`;
}

function renderRecommendationReason(req,rec,chip,scoring,rank){
  const cats=scoring.categories||{};
  const categoryWeights=scoring.category_weights||{};
  const total=scoring.total!=null?Number(scoring.total).toFixed(0):(rec.score!=null?Number(rec.score).toFixed(0):'—');
  const isInference=req.scenario==='inference';
  const minCards=isInference?(rec.full_cards??rec.vram_cards??rec.recommended_cards):(rec.vram_cards??rec.full_cards??rec.recommended_cards);
  const targetCards=rec.recommended_cards??minCards;
  const meets=String(rec.meets_sla).toLowerCase()!=='false';
  const reasons=[
    `<b>综合评分：</b>四大类加权总分 ${esc(total)}/100，候选排名第 ${esc(rank)}。`,
  ];
  const reasonCategoryOrder=[
    ['ecosystem_maturity','生态成熟度','框架、工具链与来源真实度综合'],
    ['benchmark_evidence','实测验证度','真实 benchmark 数量与质量'],
    ['compute_power','算力性能',`单卡显存 ${chip.vram_gb??'—'}GB、带宽 ${chip.vram_bw_gb_s??'—'}GB/s`],
    ['cost_effectiveness','性价比','能效与服务器节点效率综合'],
  ];
  reasonCategoryOrder.forEach(([id,label,note])=>{
    const cat=cats[id];
    if(!cat||cat.score==null)return;
    const weight=cat.weight??categoryWeights[id]??0;
    const weighted=cat.weighted??(Number(cat.score)*Number(weight));
    reasons.push(`<b>${esc(label)}：</b>${Number(cat.score).toFixed(0)}/100 × ${(Number(weight)*100).toFixed(0)}% = 加权${Number(weighted).toFixed(0)}分；${esc(note)}。`);
  });
  reasons.push(isInference
    ? `<b>部署适配：</b>最小部署 ${esc(minCards)} 卡，${esc(req.concurrency||1)} 并发目标建议 ${esc(targetCards)} 卡。`
    : `<b>部署适配：</b>最小部署 ${esc(minCards)} 卡，理想部署建议 ${esc(targetCards)} 卡${rec.estimated_training_days!=null?`，预计训练 ${esc(rec.estimated_training_days)} 天`:''}。`);
  if(!meets)reasons.push(`<b>约束提醒：</b>当前显式SLA尚未满足，建议增加资源或调整目标。`);
  return `<section class="rec-overview-panel rec-reason-panel">
    <div class="rec-overview-title">💡 芯片推荐理由</div>
    <ul class="rec-reason-list">${reasons.map(x=>`<li>${x}</li>`).join('')}</ul>
  </section>`;
}

function renderQuantityEstimate(req,rec,chip){
  const isInference=req.scenario==='inference';
  const minCards=isInference?(rec.full_cards??rec.vram_cards??rec.recommended_cards):(rec.vram_cards??rec.full_cards??rec.recommended_cards);
  const targetCards=rec.recommended_cards??minCards;
  const minVram=isInference?(req.full_vram_gb??req.min_vram_gb):(req.min_vram_gb??req.full_vram_gb);
  const targetVram=isInference?(req.target_vram_gb??req.full_vram_gb):(req.full_vram_gb??req.min_vram_gb);

      : `最小显存下限 ${Number(minVram||0).toFixed(1)}GB；无额外性能目标时与最小相同`;

      </div>
      <div class="rec-quantity-tier primary">
        <div class="qt-name">${esc(targetName)}</div>
        <div class="qt-cards">${esc(targetCards)}<small>卡</small></div>

async function runRecommend(){
  const loading=$('rec-loading'), results=$('rec-results');
  show(loading);results.innerHTML='';

  const model=$('rec-model').value.trim();
  if(!model){results.innerHTML='<div class="error">请输入模型名称</div>';hide(loading);return}

  const params = new URLSearchParams();
  params.set('model',model);
  const sc=$('rec-scenario').value; params.set('scenario',sc);
  if(sc==='train'){
    params.set('stage',$('rec-stage').value);
    if($('rec-stage').value==='sft') params.set('method',$('rec-method').value);
    else params.set('method','full_param');
    const tokens=$('rec-tokens').value;if(tokens)params.set('training_tokens',tokens);
    const days=$('rec-days').value;if(days)params.set('training_days',days);
    const bs=$('rec-batch-size').value;if(bs)params.set('batch_size',bs);
    const sl=$('rec-seq-len').value;if(sl)params.set('seq_len',sl);
  } else if(sc==='quantize'){
    params.set('method',$('rec-quantize-method').value);
    params.set('quantize_bits',$('rec-quantize-bits').value);
  } else {
    params.set('quant',$('rec-quant').value);
    const inLen=$('rec-input-len').value;if(inLen)params.set('input_len',inLen);
    const outLen=$('rec-output-len').value;if(outLen)params.set('output_len',outLen);
    const conc=$('rec-concurrency').value;if(conc)params.set('concurrency',conc);
    const tps=$('rec-tps').value;if(tps)params.set('sla_tps',tps);
  }
  const mc=$('rec-max-cards').value;if(mc)params.set('max_cards',mc);
  const mnc=$('rec-min-cards').value;if(mnc)params.set('min_cards',mnc);
  const mp=$('rec-max-price').value;if(mp)params.set('max_price',mp);
  if($('rec-domestic').classList.contains('on'))params.set('prefer_domestic','true');
  const pv=$('rec-vendor').value;if(pv)params.set('prefer_vendor',pv);
  params.set('limit','20');params.set('tier','datacenter');

  const data = await fetchJSON(`${API}/chips/recommend?${params}`);
  hide(loading);
  if(data._error){results.innerHTML=`<div class="error">${esc(data._error)}</div>`;return}

  const req = data.requirements||{};
  const scoringMeta = data.scoring_meta||{};
  const dimMeta = scoringMeta.dimensions||[];

  results.innerHTML = `
    <div class="info" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span>模型: <b>${esc(data.model||'')}</b> · 场景: <b>${req.scenario_label||(req.scenario==='train'?'训练':'推理')}</b>
      <a href="https://docs.vllm.ai/projects/ascend/zh-cn/v0.18.0/quick_start.html" target="_blank" rel="noopener" style="margin-left:8px;font-size:0.75rem;color:var(--accent);white-space:nowrap">📖 vLLM Ascend 部署指南 →</a>
      · VRAM: <b>${req.scenario==='inference'
        ? `${req.full_vram_gb} GB（最小） / ${req.target_vram_gb} GB（${req.concurrency}并发）`
        : `${req.min_vram_gb} GB`}</b>
      ${req.vram_formula ? `· <span style="font-size:0.7rem;color:var(--text2)" title="${esc(req.vram_formula)}">${esc(req.vram_formula.substring(0,60))}…</span>` : ''}
      · 候选: <b>${data.candidates?.length||0}</b> · 排除: <b>${data.rejected||0}</b></span>
      <button class="btn" onclick="showMethodology()" style="font-size:0.75rem;padding:4px 12px">📖 算法说明</button>
    </div>
    ${(data.candidates||[]).map((c,i)=>{
      const rec = c.recommend||{};
      const scoring = c.scoring||{};
      const dimNameMap = {};
      dimMeta.forEach(m=>{ dimNameMap[m.id]=m; });
      return `
        <div class="rec-card ${i===0?'best':''}">
          <div class="rec-rank">#${i+1} · 综合评分 ${scoring.total!=null?scoring.total.toFixed(0):rec.score} / 100 · ${esc(c.chip_model)} <span style="color:var(--text2);font-weight:400">${esc(c.vendor_display||'')}</span></div>
          <div class="rec-overview-grid">
            ${renderChipBasicInfo(c)}
            ${renderRecommendationReason(req,rec,c,scoring,i+1)}
            ${renderQuantityEstimate(req,rec,c)}
          </div>
          ${renderCalcBreakdown(req, rec, c, scoring)}
          <div class="rec-scoring-breakdown">
            <div class="rec-scoring-toggle" id="scoring-toggle-${i}" onclick="toggleScoringDetail(${i})">
              <span class="arrow">▶</span> 📊 评分细则
            </div>
            <div class="rec-scoring-panel" id="scoring-panel-${i}">
              ${renderScoringDetail(scoring, dimNameMap)}
            </div>
          </div>
        </div>
      `;
    }).join('')}
  `;
}

// ── Row 1: Calculation & recommendation params ──
function renderCalcRow(req, rec, chip){
  const items = [];
  const fmtCalcGb = v => { const n=Number(v||0); return n>0&&n<0.1?n.toFixed(3):n.toFixed(1); };
  const isInference = req.scenario === 'inference';
  const idealLabel = isInference ? '目标并发' : '理想';
  // VRAM (推理: 最小档=权重+单请求峰值KV / 目标并发；训练/量化仅一个显存下限)
  if(req.min_vram_gb != null){
    const fullGb = req.full_vram_gb != null ? req.full_vram_gb : req.min_vram_gb;
    const comps = req.vram_calculation?.components || [];
    const componentText = comps.map(x=>`${x.label} ${fmtCalcGb(x.result_gb)}GB`).join(' + ');
    if(isInference){
      const targetGb = req.target_vram_gb != null ? req.target_vram_gb : fullGb;
      items.push({
        label:'显存需求 (最小/目标并发)',
        value:`${fullGb.toFixed(1)} / ${Number(targetGb).toFixed(1)} GB`,
        detail:`最小=权重+单请求峰值KV；目标并发=${fmtCalcGb(req.vram_calculation?.target_concurrency?.weight_gb||0)}GB权重 + ${fmtCalcGb(req.kv_cache_gb||0)}GB KV×${req.concurrency||1}`,
      });
    }else{
      items.push({label:'显存需求（最小部署）', value:`${req.min_vram_gb.toFixed(1)} GB`, detail:componentText||'展开下方明细查看逐项公式'});
    }
  }
  // KV Cache (推理场景单独显示)
  if(req.kv_cache_gb != null && req.kv_cache_gb > 0){
    items.push({label:'单请求峰值 KV Cache', value:`${fmtCalcGb(req.kv_cache_gb)} GB`, detail:`输入 ${req.input_len||'?'} + 输出 ${req.output_len||'?'} = ${req.total_context||'?'} tokens · KV元素精度 ${req.kv_cache_dtype||'BF16/FP16 (2 bytes/element)'}，与权重量化独立`});
  }
  // Cards (推理只展示最小档 / 目标并发两档)
  const minC = rec.vram_cards, fullC = rec.full_cards != null ? rec.full_cards : rec.recommended_cards, idealC = rec.recommended_cards;
  const minRaw = rec.card_calculation?.minimum?.raw_cards;
  const rawText = minRaw!=null ? ` · 最小档原始${minRaw}卡→取2幂${minC}卡` : '';
  if(isInference){
    const targetCalc = rec.card_calculation?.ideal || {};
    items.push({
      label:'卡数 (最小/目标并发)',
      value:`${fullC} / ${idealC}`,
      detail:`单卡${chip.vram_gb||'?'}GB · 目标并发按权重仅加载一份的统一显存池计算${targetCalc.throughput_rounded_cards?'，并叠加显式吞吐约束':''}`,
    });
  }else{
    items.push({label:`卡数 (最小/${idealLabel})`, value:`${minC} / ${idealC}`, detail:`单卡${chip.vram_gb||'?'}GB${rawText} · ${idealLabel}按性能目标与最小部署取较大值`});
  }
  // Training time
  if(rec.estimated_training_days != null){
    const parts = [];
    if(req.target_training_days) parts.push(`目标${req.target_training_days}天`);
    if(req.training_tokens_T) parts.push(`${req.training_tokens_T}T tokens`);
    items.push({label:'预计训练', value:`${rec.estimated_training_days.toFixed(1)} 天`, detail:parts.join(' · ')});
  }
  // Price
  if(rec.total_cost_wan != null){
    items.push({label:'总价', value:`${rec.total_cost_wan} 万`, detail:`${rec.recommended_cards||rec.vram_cards}卡 × ${chip.price_cny_wan||'?'}万/卡`});
  }
  if(!items.length) return '';
  return items.map(it=>`
    <div class="rec-calc-item">
      <div class="rcl">${it.label}</div>
      <div class="rcv"${it.cls?` style="${it.cls}"`:''}>${esc(it.value)}</div>
      ${it.detail ? `<div class="rcd">${esc(it.detail)}</div>` : ''}
    </div>
  `).join('');
}

// ── Row 2: Chip specs inline (comma-separated) ──
function renderChipSpecInline(chip){
  const specs = [
    {key:'vram_gb', label:'显存', fmt:v=>v!=null?`${v} GB`:null},
    {key:'tdp_w', label:'TDP', fmt:v=>v!=null?`${v} W`:null},
    {key:'architecture', label:'架构', fmt:v=>v||null},
    {key:'process_node_nm', label:'制程', fmt:v=>v!=null?`${v} nm`:null},
    {key:'vram_bw_gb_s', label:'带宽', fmt:v=>v!=null?`${v} GB/s`:null},
    {key:'precision_perf', label:'精度性能', fmt:v=>v||null},
    {key:'price_cny_wan', label:'单价', fmt:v=>v!=null?`~${v} 万`:null},
    {key:'interconnect_tech', label:'互联', fmt:v=>v||null},
    {key:'maturity_level', label:'成熟度', fmt:v=>v||null},
  ];
  const parts = [];
  specs.forEach(s=>{
    const val = s.fmt(chip[s.key]);
    if(val) parts.push({key:s.key, label:s.label, val});
  });
  return parts.map(s=>`<span class="chip-spec">${esc(s.label)}（${esc(s.val)}）</span>`).join('<span class="chip-spec-sep">|</span>');
}

  }

function formatScoreTraceField(label, type, value){
  if(type==='boolean'){
    const missing = value===true || value==='true';
    return `${label}=${missing?'是（使用默认值或统计估计）':'否（数据存在）'}`;
  }
  if(type==='percent') return `${label}=${(Number(value||0)*100).toFixed(1)}%`;
  const shown = typeof value==='number' ? value.toFixed(2) : String(value);
  return `${label}=${shown}${type?` ${type}`:''}`;
}

function getScoreTraceChinese(dimId, raw){
  const cfg = SCORE_TRACE_EXPLAIN_CN[dimId] || {};
  const fields = cfg.fields || {};
  const values = Object.entries(raw||{})
    .filter(([key])=>key!=='formula'&&key!=='source'&&key!=='note')
    .map(([key,value])=>{
      const field = fields[key] || [key,''];
      return formatScoreTraceField(field[0],field[1],value);
    });
  return {
    formula:cfg.formula||'该公式把当前指标值换算成0至100分。',
    raw:values.length?`本次计算使用：${values.join('；')}。`:'本项没有额外的代入参数。',
    source:cfg.source||'数据来自芯片数据库或由当前推荐条件计算得出。'
  };
}

function renderScoreChineseExplain(dimId, score, raw, meta){
  const base = meta.explain_cn || SCORE_DIM_EXPLAIN_CN[dimId] || meta.desc || '该项用于衡量芯片在这一维度的表现。';
  const scoreText = Number.isFinite(Number(score)) ? `${Number(score).toFixed(0)}/100` : '暂无';
  if(raw && raw.missing){
    return `💬 总结：${base} 当前缺少有效数据，${scoreText}为默认值或统计估计，不能直接视为真实性能。`;
  }
  const level = score >= 80 ? '表现较强' : score >= 60 ? '表现良好' : score >= 40 ? '处于中等水平' : '相对偏弱';
  return `💬 总结：${base} 当前得分${scoreText}，${level}。`;
}

function renderScoringDetail(scoring, dimNameMap) {
  if (!scoring) return '<div class="empty">暂无评分数据</div>';

  // v4.0: use categories structure
  const cats = scoring.categories;
  if (!cats) {
    // Fallback: old flat dimensions
    const dims = scoring.dimensions;
    if (!dims) return '<div class="empty">暂无评分数据</div>';
    return renderFlatScoringDetail(dims, dimNameMap);
  }

  const catOrder = [
    {id:'ecosystem_maturity', icon:'🌐'},
    {id:'benchmark_evidence', icon:'🧪'},
    {id:'compute_power', icon:'⚡'},
    {id:'cost_effectiveness', icon:'💰'}
  ];

  const sections = catOrder.map(({id, icon}) => {
    const cat = cats[id];
    if (!cat) return '';
    const subDims = cat.sub_dimensions || {};
    const entries = Object.entries(subDims).filter(([,v]) => v.score > 0 || v.weight > 0);
    if (!entries.length) return '';

    return `<div class="rec-scoring-cat">
      <div class="rec-scoring-cat-header">
        ${icon} ${esc(cat.name_cn)}
        <span style="color:var(--text2);font-size:0.65rem;font-weight:400">大类权重 ${(cat.weight*100).toFixed(0)}%</span>
        <span class="cat-score">${cat.score.toFixed(0)} 分 · 加权 ${cat.weighted.toFixed(0)}</span>
      </div>
      ${entries.map(([dimId, v]) => {
        const meta = dimNameMap[dimId] || {};
        const name = meta.name_cn || dimId;
        const subWt = meta.sub_weight || v.weight;
        const catWt = cat.weight || 0;
        const globalWt = subWt * catWt;
        const raw = v.raw_values || {};
        const detail = v.detail || '';
        const formula = raw.formula || '';
        const source = raw.source || raw.note || '';
        const rawStr = Object.entries(raw).filter(([rk])=>rk!=='formula'&&rk!=='source'&&rk!=='note').map(([rk,rv])=>`${rk}=${typeof rv==='number'?rv.toFixed(2):rv}`).join(', ');
        const traceCn = getScoreTraceChinese(dimId, raw);

        return `<div class="rec-scoring-dim">
          <div class="dim-head">
            <span class="dim-name">${esc(name)}</span>
            <span class="dim-wbar">子权重 ${(subWt*100).toFixed(1)}% × ${(catWt*100).toFixed(0)}% = 全局 ${(globalWt*100).toFixed(1)}%</span>
            <span style="font-weight:700;color:var(--accent);font-size:0.75rem;margin-left:auto">${v.score.toFixed(0)}<span style="font-size:0.6rem;color:var(--text3)">/100</span></span>
            <span style="color:var(--text3);font-size:0.6rem">加权 ${v.weighted.toFixed(0)}</span>
          </div>
          <div class="dim-calc">${esc(detail)}</div>
          ${formula ? `<div class="dim-formula">📐 公式: ${esc(formula)}</div><div class="dim-trace-explain">↳ ${esc(traceCn.formula)}</div>` : ''}
          ${rawStr ? `<div class="dim-raw">📊 代入: ${esc(rawStr)}</div><div class="dim-trace-explain">↳ ${esc(traceCn.raw)}</div>` : ''}
          <div class="dim-raw">📂 ${esc(source||'计算派生值')}</div><div class="dim-trace-explain">↳ ${esc(traceCn.source)}</div>
          <div class="dim-explain">${esc(renderScoreChineseExplain(dimId, v.score, raw, meta))}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  // Total score formula
  const total = scoring.total!=null ? scoring.total.toFixed(0) : '?';
  const cw = scoring.category_weights || {};
  const catNames2 = {compute_power:'算力性能', cost_effectiveness:'性价比', ecosystem_maturity:'生态成熟度', benchmark_evidence:'实测验证度'};
  const totalParts = Object.entries(cw).filter(([,v])=>v>0).map(([k,v])=>
    `${catNames2[k]||k}: ${cats[k]?.score?.toFixed(0)||'?'} × ${(v*100).toFixed(0)}% = ${cats[k]?.weighted?.toFixed(0)||'?'}`
  );
  const totalFormula = totalParts.length ? `总分 = ${totalParts.join(' + ')} = ${total}` : `总分 = ${total}`;

  return `<div style="font-size:0.68rem;color:var(--text3);margin-bottom:6px">📊 评分明细 v${scoring.version||'4.4'} — 4大类·8子维度</div>
    ${sections}
    <div style="margin-top:6px;padding:6px 10px;background:var(--bg4);border-radius:4px;font-size:0.7rem;color:var(--text)">
      <b>总分计算</b>: ${esc(totalFormula)}
    </div>`;
}

// ── Score Tooltip (floating) ──
let _tooltipEl = null;
function getTooltip(){
  if(!_tooltipEl){
    _tooltipEl = document.createElement('div');
    _tooltipEl.className = 'score-tooltip';
    document.body.appendChild(_tooltipEl);
  }
  return _tooltipEl;
}
function showScoreTooltip(ev, data){
  const tt = getTooltip();
  const rawEntries = Object.entries(data.raw||{}).filter(([,v])=>v!=null&&v!==''&&String(v)!=='undefined');
  const src = data.raw?.source || data.raw?.note;
  tt.innerHTML = `
    <div class="tt-title"><span>${esc(data.name)}</span><span class="tt-score">${data.score.toFixed(0)}<span style="font-size:0.65rem;color:var(--text3)">/100</span></span></div>
    <div class="tt-formula">${esc(data.detail)}</div>
    ${rawEntries.length ? '<div class="tt-raw">'+rawEntries.map(([k,v])=>`<span>${esc(k)}: <b>${esc(typeof v==='number'?v.toFixed(2):String(v))}</b></span>`).join(' ')+'</div>' : ''}
    ${src ? '<div class="tt-raw" style="margin-top:3px;font-size:0.6rem;color:var(--text3)">📂 '+esc(String(src).slice(0,120))+'</div>' : ''}
    <div class="tt-weight">权重: ${data.weight.toFixed(2)} · 加权: ${(data.score*data.weight).toFixed(0)}</div>
  `;
  tt.classList.add('visible');
  moveScoreTooltip(ev);
}
function moveScoreTooltip(ev){
  const tt = getTooltip();
  const x = ev.clientX + 16, y = ev.clientY - 10;
  const r = tt.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const finalX = x + r.width > vw - 10 ? ev.clientX - r.width - 16 : x;
  const finalY = y + r.height > vh - 10 ? ev.clientY - r.height - 10 : y;
  tt.style.left = finalX + 'px';
  tt.style.top = finalY + 'px';
}
function hideScoreTooltip(){
  getTooltip().classList.remove('visible');
}
